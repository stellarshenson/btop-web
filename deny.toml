[advisories]
version = 2
yanked = "deny"
# basic-toml 0.1.10 is parsed at compile time by askama's derive macro and is not linked into the
# binary; askama 0.16.1 is the newest release, so no upgrade removes it. Re-check when askama moves.
# ttf-parser 0.25.1 is a dev-dependency that parses a fixed in-repo font in tests/font.rs and is not
# linked into the binary; 0.25.1 is the newest release and the advisory offers no safe upgrade.
# Re-check if the dev dependency ever needs fixing; the test could move to skrifa.
ignore = ["RUSTSEC-2026-0374", "RUSTSEC-2026-0192"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
