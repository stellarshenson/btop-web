name: Feature request
description: Suggest a change to btop-web
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A request tied to a real problem is easier to assess than a preferred implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today, and who hits it
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like btop-web to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including doing nothing
    validations:
      required: false
