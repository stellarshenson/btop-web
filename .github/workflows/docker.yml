name: Docker

on:
  push:
    # cargo-release tags btop-web-v<version>; make release prints btop-web-v1.0.2
    tags: ["btop-web-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # type=semver refuses the crate prefix in the tag, so the groups take the version out of it
          tags: |
            type=match,pattern=btop-web-v(.*),group=1
            type=match,pattern=btop-web-v(\d+\.\d+),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
