name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref cancels the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Empty by default: rocm needs librocm_smi64 and libclang, which ubuntu-latest lacks.
  # The Makefile reads FEATURES from the environment and adds --features itself.
  FEATURES: ""

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same channel as rust-toolchain.toml. The tag pins it: @master needs a toolchain input.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Installed so the Makefile's deny target checks instead of skipping.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov
      - name: Gate
        run: make ci
      - name: Deny
        run: make deny
      - name: Coverage
        run: cargo llvm-cov --workspace ${FEATURES:+--features $FEATURES} --lcov --output-path lcov.info
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      - name: Zizmor
        uses: zizmorcore/zizmor-action@v0.2.0
        with:
          advanced-security: false

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
