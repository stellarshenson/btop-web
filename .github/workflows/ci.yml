name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Empty by default: rocm needs librocm_smi64 and libclang, which ubuntu-latest lacks.
  FEATURES: ""

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets ${FEATURES:+--features $FEATURES} -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets ${FEATURES:+--features $FEATURES}
      - name: Deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace ${FEATURES:+--features $FEATURES} --lcov --output-path lcov.info
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      - name: Zizmor
        uses: zizmorcore/zizmor-action@v0.2.0
        with:
          advanced-security: false

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
