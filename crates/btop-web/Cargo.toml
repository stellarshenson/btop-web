[package]
name = "btop-web"
description = "btop's system telemetry served to a web browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
rocm = ["dep:rocm_smi_lib"]

[dependencies]
anyhow.workspace = true
askama.workspace = true
async-stream = "0.3"
axum.workspace = true
itoa = "1"
nix = { version = "0.30", features = ["dir", "fs", "hostname", "net", "feature", "user"] }
nvml-wrapper = "0.13"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
rocm_smi_lib = { version = "0.3.2", optional = true }
rust-embed = { workspace = true, features = ["mime-guess"] }
spline1d = { version = "0.1.1", default-features = false, features = ["alloc"] }
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true
