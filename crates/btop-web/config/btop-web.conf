# btop-web configuration
#
# btop.conf dialect: `key = value` lines, `#` starts a comment.
# Precedence: these embedded defaults, then a file given with --config,
# then BTOP_WEB_LISTEN, BTOP_WEB_UPDATE_MS and BTOP_WEB_PROC_ROOT.
# Unknown keys are ignored and invalid values stop startup.

# Address the HTTP server binds to. Loopback by default: the dashboard has no
# authentication and exposes process names, users and network endpoints.
# The default port folds the UTF-8 bytes of "btop-web" as
# v = (v * 256 + byte) mod (65536 - 1024), giving v = 39266 and
# port = 1024 + 39266 = 40290. A file, --config or BTOP_WEB_LISTEN overrides it.
listen = 127.0.0.1:40290

# What this process does (ACC-NET-143-AGENT-MODES). standalone samples this
# host and serves the dashboard; agent samples this host and serves telemetry
# only (/events, /healthz, /readyz); client samples nothing and serves the
# dashboard from the agents named by `connect`. The --agent and --client flags
# outrank this key.
mode = standalone

# An agent a client shows, as NAME=http://HOST:PORT, one line per agent. NAME
# matches [A-Za-z0-9._-] and is unique; the page shows every name with its
# sample age, and the first agent is selected until a chip is clicked.
# connect = nas=http://10.0.0.5:40290

# The access key file for each agent (ACC-NET-144-ACCESS-KEY), as NAME=/PATH,
# one line per `connect` agent and required in client mode. An agent prints
# its key once on the start that creates it and keeps it at
# $XDG_CONFIG_HOME/btop-web/access-key; copy that key to a file on this host
# and name the file here. The --connect flag carries the URL only, never the
# key. The key itself is never a value in this file.
# ACC-NET-146-SECRET-INPUT: NAME=fd:N reads the key once from an inherited
# descriptor instead of a path.
# connect_key = nas=/home/you/.config/btop-web/access-key

# The agent listener's TLS certificate and private key (ACC-NET-145-TLS-PINNING),
# in PEM, as `tls_cert = /PATH` and `tls_key = /PATH`; give both or neither.
# Without both the agent generates a self-signed ECDSA P-256 pair on its first
# start at $XDG_CONFIG_HOME/btop-web/agent.crt and agent.key (the key mode
# 0600) and reuses it on every later start. A given pair is never written to
# disk. The --tls-cert and --tls-key flags outrank these keys.
# ACC-NET-146-SECRET-INPUT: tls_cert_fd and tls_key_fd read the same secrets
# once from an inherited descriptor instead of a path; give the path key or
# its descriptor key, not both. An encrypted PKCS#8 key gets its passphrase
# from the environment variable named by tls_key_passphrase_env, or from the
# file or descriptor named by tls_key_passphrase_file and
# tls_key_passphrase_fd; give at most one. A missing variable, an unreadable
# passphrase source or a wrong passphrase stops startup.
# tls_cert = /home/you/.config/btop-web/agent.crt
# tls_key = /home/you/.config/btop-web/agent.key
# tls_key_passphrase_env = BTOP_WEB_TLS_PASSPHRASE
# tls_key_passphrase_file = /home/you/.config/btop-web/agent.passphrase

# The agent listener's access key (ACC-NET-146-SECRET-INPUT), as a path or a
# descriptor. Without either key the access key is generated on the first
# start at $XDG_CONFIG_HOME/btop-web/access-key; a given key is only read,
# never created, and it is never printed. The --access-key-file and
# --access-key-fd flags outrank these keys.
# access_key = /run/secrets/btop-web-access-key
# access_key_fd = 4

# The client's fingerprint pin file (ACC-NET-145-TLS-PINNING), as a path.
# Without it the client uses $XDG_CONFIG_HOME/btop-web/known_agents and
# creates it on the first connect; a file named here must exist. The
# --known-agents flag outranks it.
# known_agents = /home/you/.config/btop-web/known_agents

# The shipped theme, numbered in picker order: 0 Default, 1 Everforest Medium,
# 2 Flexoki, 3 Gruvbox, 4 Solarized, 5 Synthwave, 6 Terracotta, 7 Ultraviolet,
# 8 Cyberpunk, 9 Steel.
# A stored browser choice wins over this.
theme = 0

# Collector sampling interval in milliseconds, 100 to 86400000. btop-web's
# default is 250; btop's own default is 2000.
update_ms = 250

# Time every chart spans, in seconds: 60, 120, 180, 300 or 600. The histories
# keep that much and the axis labels follow it; 180 is the 3 minute default.
window_s = 180

# CPU load reporting: normalised shows each 1, 5 and 15 minute load average as
# a percent of all cores (0 to 100); aggregate shows it as a percent of one
# core summed over the cores (0 to the core count times 100).
cpu_load = normalised

# Filesystem root the collectors read. Tests point it at a recorded tree.
proc_root = /proc

# Memory and disk collection keys, with btop 1.3.0's defaults. Mounts and
# fstab are read beside proc_root: /proc maps to /etc, a recorded tree to its
# sibling etc directory. statvfs runs on each mountpoint under the parent of
# proc_root: / for /proc, the tree itself for a recorded tree.

# Swap values and rows in the memory box.
show_swap = True

# Show swap as a disk entry after the first disk.
swap_disk = True

# Collect disk usage and IO.
show_disks = True

# Count the ZFS ARC as cached memory, leaving memory below c_min unavailable.
zfs_arc_cached = True

# Read the disk list from /etc/fstab. This disables only_physical.
use_fstab = True

# Keep only filesystem types listed as physical in /proc/filesystems.
only_physical = True

# Hide ZFS datasets and aggregate IO per pool.
zfs_hide_datasets = False

# Count f_bfree instead of f_bavail as free space.
disk_free_priv = False

# Mountpoint include filter; begin with exclude= to exclude instead.
disks_filter = ""

# Draw disk IO activity.
show_io_stat = True

# CPU collection keys, with btop 1.3.0's defaults. check_temp also gates the
# GPU temperature read.

# Read and show the CPU frequency.
show_cpu_freq = True

# Read CPU and GPU temperatures.
check_temp = True

# Read per-core temperatures when check_temp is on and sensors are found.
show_coretemp = True

# Sensor feeding the CPU temperature; Auto keeps btop's choice.
cpu_sensor = Auto

# Core-to-sensor overrides as whitespace-separated x:y pairs, for example
# "4:0 5:1".
cpu_core_map = ""

# Battery statistics when a battery is present.
show_battery = True

# Battery device name; Auto picks the first battery, then the first UPS.
selected_battery = Auto

# CPU name override; empty keeps btop's shortened model name.
custom_cpu_name = ""

# GPU collection keys, with btop 1.3.0's defaults.

# Measure PCIe throughput on NVIDIA cards through NVML.
nvml_measure_pcie_speeds = True

# GPU information in the CPU box: Auto, On or Off.
show_gpu_info = Auto

# GPU name overrides by index; empty keeps btop's normalized name.
custom_gpu_name0 = ""
custom_gpu_name1 = ""
custom_gpu_name2 = ""
custom_gpu_name3 = ""
custom_gpu_name4 = ""
custom_gpu_name5 = ""

# Network collection keys, with btop 1.3.0's defaults.

# Interface to start with; empty auto-selects.
net_iface = ""

# Auto-rescale the network graphs: five consecutive ticks above the ceiling
# raise it to 1.3 times their mean.
net_auto = True

# Lowest auto-scaled ceiling in Mbit/s; idle traffic draws below it.
net_floor = 1

# Seconds below a tenth of the ceiling before it falls to 3 times the mean of
# the last five samples, never under net_floor.
net_fall = 300

# Share the auto scale between download and upload.
net_sync = True

# Fixed graph ceilings in Mebibits, used when net_auto is False.
net_download = 100
net_upload = 100

# Process collection keys, with btop 1.3.0's defaults.

# Sort mode: pid, name, command, threads, user, memory, cpu direct or cpu lazy.
proc_sorting = "cpu lazy"

# Reverse the sort order.
proc_reversed = False

# Order processes as a parent-before-child tree.
proc_tree = False

# Show process CPU as a share of one core rather than all cores.
proc_per_core = False

# Keep only processes whose pid, name, command or user contains this text.
proc_filter = ""

# Hide kernel threads, as htop does.
proc_filter_kernel = False

# ACC-PERF-149-SPLIT-CADENCE: how often the process list, its counts and the
# chart paths rebuild, in milliseconds, 250 to 5000. CPU, memory, network and
# gauge values keep update_ms and move four times faster at the defaults.
proc_refresh_ms = 1000
