<div class="chip-agents" id="agents" hx-get="{{ strip_url }}" hx-trigger="every 1s" hx-swap="outerHTML" role="group" aria-label="Agents">{% for chip in chips %}<a class="chip chip-agent {{ chip.state }}{% if chip.selected %} on{% endif %}" href="?agent={{ chip.name }}"{% if chip.selected %} aria-current="page"{% endif %} title="Agent {{ chip.name }} and the age of its last sample"><span class="up">{{ chip.name }}</span><b class="agent-age" data-w="unavailable">{{ chip.text }}</b></a>{% endfor %}</div>
